name: Build HiBoP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prepare_matrix:
    name: Select build platforms
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          SELECTED_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          case "$SELECTED_PLATFORM" in
            all)
              matrix='{"include":[{"name":"Linux","platform":"linux","os":"ubuntu-24.04","module":"StandaloneLinux64","modules":"","cli_target":"Linux64","artifact":"HiBoP-Linux"},{"name":"Windows","platform":"windows","os":"windows-latest","module":"StandaloneWindows64","modules":"","cli_target":"Win64","artifact":"HiBoP-Windows"},{"name":"macOS (ARM64)","platform":"macos","os":"macos-latest","module":"StandaloneOSX","modules":"mac-il2cpp","cli_target":"OSXUniversal","artifact":"HiBoP-macOS-arm64"}]}'
              ;;
            linux)
              matrix='{"include":[{"name":"Linux","platform":"linux","os":"ubuntu-24.04","module":"StandaloneLinux64","modules":"","cli_target":"Linux64","artifact":"HiBoP-Linux"}]}'
              ;;
            windows)
              matrix='{"include":[{"name":"Windows","platform":"windows","os":"windows-latest","module":"StandaloneWindows64","modules":"","cli_target":"Win64","artifact":"HiBoP-Windows"}]}'
              ;;
            macos)
              matrix='{"include":[{"name":"macOS (ARM64)","platform":"macos","os":"macos-latest","module":"StandaloneOSX","modules":"mac-il2cpp","cli_target":"OSXUniversal","artifact":"HiBoP-macOS-arm64"}]}'
              ;;
            *)
              echo "Unsupported platform: $SELECTED_PLATFORM" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare_matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare macOS native bundles
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          for bundle_name in hbp_core hbp_math EEGFormat; do
            bundle="Assets/Plugins/x86_64/MacOS/$bundle_name.bundle"
            test -d "$bundle"
            plist="$bundle/Contents/Info.plist"
            plutil -lint "$plist"
            executable_name=$(plutil -extract CFBundleExecutable raw "$plist")
            plugin="$bundle/Contents/MacOS/$executable_name"
            test -f "$plugin"
            lipo "$plugin" -verify_arch arm64

            # The bundle may have transited through a Git checkout on Windows.
            # Recreate its ad-hoc signature before Unity can load the plugin.
            xattr -cr "$bundle"
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ matrix.module }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.module }}-
            Library-

      - name: Install Unity Hub (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://hub.unity3d.com/linux/keys/public |
            sudo gpg --dearmor --yes -o /etc/apt/keyrings/unityhub.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" |
            sudo tee /etc/apt/sources.list.d/unityhub.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils unityhub xvfb
          unity_hub_path="$(readlink -f "$(command -v unityhub)")"
          test -x "$unity_hub_path"
          test -r "$(dirname "$unity_hub_path")/resources/app.asar"
          echo "UNITY_HUB_PATH=$unity_hub_path" >> "$GITHUB_ENV"
          sudo tee /usr/local/bin/unity-hub > /dev/null <<'EOF'
          #!/usr/bin/env bash
          exec xvfb-run --auto-servernum "$UNITY_HUB_PATH" "$@"
          EOF
          sudo chmod +x /usr/local/bin/unity-hub

      - name: Install Unity
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          unity-version: 6000.5.2f1
          build-targets: ${{ matrix.module }}
          modules: ${{ matrix.modules }}
          auto-update-hub: false

      - name: Activate Unity licence
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build ${{ matrix.name }}
        run: |
          set -euo pipefail
          "$UNITY_EDITOR_PATH" \
            -batchmode -quit -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget ${{ matrix.cli_target }} \
            -executeMethod HBP.Dev.HBPBuilder.BuildFromCommandLine \
            -buildOutput "$GITHUB_WORKSPACE/build" \
            -scriptingBackend IL2CPP \
            -logFile -

      - name: Validate Windows native plugins
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildFolder = Get-ChildItem -LiteralPath build -Directory | Select-Object -First 1
          if (-not $buildFolder) {
            throw "The Unity build directory was not created."
          }

          foreach ($pluginName in @("hbp_core.dll", "hbp_math.dll", "EEGFormat.dll")) {
            $plugins = @(Get-ChildItem -LiteralPath $buildFolder.FullName -Recurse -File -Filter $pluginName)
            if ($plugins.Count -ne 1) {
              throw "Expected exactly one packaged $pluginName, found $($plugins.Count)."
            }

            $bytes = [System.IO.File]::ReadAllBytes($plugins[0].FullName)
            if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "Packaged plugin is not a PE binary: $($plugins[0].FullName)"
            }
            Write-Host "Validated native plugin: $($plugins[0].FullName)"
          }

      - name: Validate Linux native plugins
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          folder=$(find build -mindepth 1 -maxdepth 1 -type d | head -1)
          for plugin_name in libhbp_core.so libhbp_math.so libEEGFormat.so; do
            plugin=$(find "$folder" -type f -name "$plugin_name" -print -quit)
            test -n "$plugin"
            file "$plugin" | grep -q 'ELF 64-bit.*x86-64'
            if ldd "$plugin" | grep -q 'not found'; then
              ldd "$plugin"
              exit 1
            fi
            echo "Validated native plugin: $plugin"
          done

      - name: Validate and sign macOS application
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          folder=$(find build -mindepth 1 -maxdepth 1 -type d | head -1)
          app=$(find "$folder" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          for bundle_name in hbp_core hbp_math EEGFormat; do
            bundle="$app/Contents/PlugIns/$bundle_name.bundle"
            test -d "$bundle"
            executable_name=$(plutil -extract CFBundleExecutable raw "$bundle/Contents/Info.plist")
            plugin="$bundle/Contents/MacOS/$executable_name"
            test -f "$plugin"
            lipo "$plugin" -verify_arch arm64
            otool -L "$plugin"
            xattr -cr "$bundle"
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

          # HBPBuilder moves ARM64 plugins after BuildPipeline.BuildPlayer. Sign
          # the completed bundle so those post-build changes are sealed too.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "Validated and signed application: $app"

      - name: Package build
        id: package
        run: |
          set -euo pipefail
          folder=$(find build -mindepth 1 -maxdepth 1 -type d | head -1)
          name=$(basename "$folder")
          archive="${name}.zip"
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --sequesterRsrc --keepParent "$folder" "$archive" ;;
            Linux)   ( cd build && zip -r -y -q "../$archive" "$name" ) ;;
            Windows) ( cd build && 7z a -tzip -bso0 "../$archive" "$name" ) ;;
          esac
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          ls -lh "$archive"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.archive }}" --clobber
