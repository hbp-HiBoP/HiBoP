name: Build HiBoP
run-name: Build HiBoP (${{ inputs.platform || 'all' }}) on ${{ github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - quest

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prepare_matrix:
    name: Select build platforms
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          SELECTED_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          set -euo pipefail
          matrix='{"include":[
            {"name":"Linux","platform":"linux","os":"ubuntu-24.04","module":"StandaloneLinux64","modules":"","cli_target":"Linux64","artifact":"HiBoP-Linux"},
            {"name":"Windows","platform":"windows","os":"windows-latest","module":"StandaloneWindows64","modules":"","cli_target":"Win64","artifact":"HiBoP-Windows"},
            {"name":"macOS (ARM64)","platform":"macos","os":"macos-latest","module":"StandaloneOSX","modules":"mac-il2cpp","cli_target":"OSXUniversal","artifact":"HiBoP-macOS-arm64"},
            {"name":"Quest","platform":"quest","os":"windows-latest","module":"Android","modules":"","artifact":"HiBoP-Quest"}
          ]}'
          case "$SELECTED_PLATFORM" in
            all) ;;
            linux|windows|macos|quest)
              matrix=$(jq --arg platform "$SELECTED_PLATFORM" '.include |= map(select(.platform == $platform))' <<< "$matrix")
              ;;
            *)
              echo "Unsupported platform: $SELECTED_PLATFORM" >&2
              exit 1
              ;;
          esac
          printf 'matrix=%s\n' "$(jq -c . <<< "$matrix")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare_matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare macOS native bundles
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          for bundle_name in hbp_core hbp_math EEGFormat; do
            bundle="Assets/Plugins/Native/macOS/arm64/$bundle_name.bundle"
            test -d "$bundle"
            plist="$bundle/Contents/Info.plist"
            plutil -lint "$plist"
            executable_name=$(plutil -extract CFBundleExecutable raw "$plist")
            plugin="$bundle/Contents/MacOS/$executable_name"
            test -f "$plugin"

            # The bundle may have transited through a Git checkout on Windows.
            # Restore its executable mode and ad-hoc signature before Unity loads it.
            chmod 755 "$plugin"
            lipo "$plugin" -verify_arch arm64
            xattr -cr "$bundle"
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: Cache Library
        if: matrix.platform != 'quest'
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ matrix.module }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.module }}-

      - name: Restore Quest Library cache
        if: matrix.platform == 'quest'
        uses: actions/cache/restore@v5
        with:
          path: Library
          key: Library-Quest-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Quest-Android-

      - name: Restore Quest Gradle cache
        if: matrix.platform == 'quest'
        uses: actions/cache/restore@v5
        with:
          path: .gradle/quest
          key: Gradle-Quest-6000.5.2f1-${{ hashFiles('Packages/**', 'Assets/Plugins/Android/**') }}
          restore-keys: Gradle-Quest-6000.5.2f1-

      - name: Install Unity
        uses: RageAgainstThePixel/unity-setup@8acd5e29b6961f6338f8073304e9551353709521 # v3.0.4
        with:
          unity-version: 6000.5.2f1
          build-targets: ${{ matrix.module }}
          modules: ${{ matrix.modules }}

      - name: Activate Unity licence
        uses: RageAgainstThePixel/activate-unity-license@f9a4e114ed89feaddf8a8dc4b958f3e538fb9be6 # v3.0.2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Test Quest network primitives on host OS
        if: matrix.platform != 'quest'
        run: |
          set -euo pipefail
          mkdir -p .test-results
          filter='HBP.Tests.Transfer.QuestNetworkTests'
          if [[ "$RUNNER_OS" == macOS ]]; then
            filter="$filter;HBP.Tests.PlatformConfiguration.BuildProfileConfigurationTests.MacNetworkPrivacyPlistRemainsReadable"
          fi
          "$UNITY_EDITOR_PATH" \
            -batchmode -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget ${{ matrix.cli_target }} \
            -runTests -testPlatform EditMode \
            -testFilter "$filter" \
            -testResults "$GITHUB_WORKSPACE/.test-results/quest-network.xml" \
            -logFile "$GITHUB_WORKSPACE/.test-results/quest-network.log"

      - name: Upload Quest network test results
        if: always() && matrix.platform != 'quest'
        uses: actions/upload-artifact@v7
        with:
          name: Quest-network-tests-${{ matrix.platform }}
          path: |
            .test-results/quest-network.xml
            .test-results/quest-network.log
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Build Desktop player
        if: matrix.platform != 'quest'
        run: |
          set -euo pipefail
          "$UNITY_EDITOR_PATH" \
            -batchmode -quit -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -buildTarget ${{ matrix.cli_target }} \
            -executeMethod HBP.Dev.HBPBuilder.BuildFromCommandLine \
            -buildOutput "$GITHUB_WORKSPACE/build" \
            -scriptingBackend IL2CPP \
            -buildCommit "$GITHUB_SHA" \
            -logFile -

      - name: Validate Windows native plugins
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildFolder = Get-ChildItem -LiteralPath build -Directory | Select-Object -First 1
          if (-not $buildFolder) {
            throw "The Unity build directory was not created."
          }

          $dataFolder = Get-ChildItem -LiteralPath $buildFolder.FullName -Directory -Filter "*_Data" | Select-Object -First 1
          if (-not $dataFolder) {
            throw "The Unity data directory was not created."
          }
          $pluginsDirectory = Join-Path $dataFolder.FullName "Plugins\x86_64"
          if (-not (Test-Path -LiteralPath $pluginsDirectory -PathType Container)) {
            throw "The expected native plugin directory is missing: $pluginsDirectory"
          }

          foreach ($pluginName in @("hbp_core.dll", "hbp_math.dll", "EEGFormat.dll")) {
            $plugins = @(Get-ChildItem -LiteralPath $buildFolder.FullName -Recurse -File -Filter $pluginName)
            if ($plugins.Count -ne 1) {
              throw "Expected exactly one packaged $pluginName, found $($plugins.Count)."
            }

            $expectedPlugin = Join-Path $pluginsDirectory $pluginName
            if ($plugins[0].FullName -ne $expectedPlugin) {
              throw "Packaged plugin is in an unexpected directory: $($plugins[0].FullName)"
            }

            $bytes = [System.IO.File]::ReadAllBytes($plugins[0].FullName)
            if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "Packaged plugin is not a PE binary: $($plugins[0].FullName)"
            }
            Write-Host "Validated native plugin: $($plugins[0].FullName)"
          }

          foreach ($legacyPattern in @("hbp_export.dll", "opencv*.dll", "boost*.dll", "concrt*.dll", "msvcp*.dll", "ucrtbase.dll", "vccorlib*.dll", "vcomp*.dll", "vcruntime*.dll")) {
            $legacyPlugins = @(Get-ChildItem -LiteralPath $dataFolder.FullName -Recurse -File -Filter $legacyPattern)
            if ($legacyPlugins.Count -ne 0) {
              throw "Editor-only legacy dependency was packaged: $($legacyPlugins[0].FullName)"
            }
          }

      - name: Validate Linux native plugins
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          folder=$(find build -mindepth 1 -maxdepth 1 -type d | head -1)
          data_folder=$(find "$folder" -mindepth 1 -maxdepth 1 -type d -name '*_Data' -print -quit)
          test -n "$data_folder"
          plugins_directory="$data_folder/Plugins/x86_64"
          test -d "$plugins_directory"
          for plugin_name in libhbp_core.so libhbp_math.so libEEGFormat.so; do
            mapfile -t plugins < <(find "$folder" -type f -name "$plugin_name" -print)
            if [[ ${#plugins[@]} -ne 1 ]]; then
              echo "Expected exactly one packaged $plugin_name, found ${#plugins[@]}." >&2
              printf '%s\n' "${plugins[@]}" >&2
              exit 1
            fi
            plugin="${plugins[0]}"
            test "$plugin" = "$plugins_directory/$plugin_name"
            file "$plugin" | grep -q 'ELF 64-bit.*x86-64'
            if ldd "$plugin" | grep -q 'not found'; then
              ldd "$plugin"
              exit 1
            fi
            echo "Validated native plugin: $plugin"
          done
          legacy_plugin=$(find "$folder" -type f \( -name 'libhbp_export.so' -o -name 'libopencv*' -o -name 'libboost*' \) -print -quit)
          if [[ -n "$legacy_plugin" ]]; then
            echo "Editor-only legacy dependency was packaged: $legacy_plugin" >&2
            exit 1
          fi

      - name: Validate and sign macOS application
        if: matrix.platform == 'macos'
        id: macos_signing
        run: |
          set -euo pipefail
          folder=$(find build -mindepth 1 -maxdepth 1 -type d | head -1)
          app=$(find "$folder" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          plutil -lint "$app/Contents/Info.plist"
          for bundle_name in hbp_core hbp_math EEGFormat; do
            bundle="$app/Contents/PlugIns/$bundle_name.bundle"
            test -d "$bundle"
            bundle_count=$(find "$app" -type d -name "$bundle_name.bundle" | wc -l | tr -d ' ')
            test "$bundle_count" = 1
            executable_name=$(plutil -extract CFBundleExecutable raw "$bundle/Contents/Info.plist")
            plugin="$bundle/Contents/MacOS/$executable_name"
            test -f "$plugin"
            lipo "$plugin" -verify_arch arm64
            otool -L "$plugin"
            xattr -cr "$bundle"
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

          legacy_bundle=$(find "$app" -type d -name 'hbp_export.bundle' -print -quit)
          test -z "$legacy_bundle"
          legacy_dependency=$(find "$app" -type f \( -name 'libopencv*' -o -name 'libboost*' \) -print -quit)
          test -z "$legacy_dependency"

          test -d "$app/Contents/Resources/Data"
          unexpected_root_entries=$(find "$app" -mindepth 1 -maxdepth 1 ! -name Contents -print)
          if [[ -n "$unexpected_root_entries" ]]; then
            echo "Unexpected entries at the macOS application bundle root:" >&2
            echo "$unexpected_root_entries" >&2
            exit 1
          fi

          # Seal Info.plist, the moved plugins and copied resources after post-processing.
          codesign --force --deep --sign - "$app"
          if codesign --verify --deep --strict --verbose=2 "$app"; then
            echo "Validated and signed application: $app"
          else
            status=$?
            codesign --display --verbose=4 --requirements - "$app" || true
            exit "$status"
          fi

      - name: Archive macOS build for signature diagnosis
        if: failure() && steps.macos_signing.outcome == 'failure'
        id: macos_recovery
        run: |
          set -euo pipefail
          folder=$(find build -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$folder"
          ditto -c -k --sequesterRsrc --keepParent "$folder" "$RUNNER_TEMP/macos-signing-recovery.zip"

      - name: Preserve macOS build for signature diagnosis
        if: failure() && steps.macos_recovery.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: macos-signing-recovery
          path: ${{ runner.temp }}/macos-signing-recovery.zip
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Validate absence of bundled ADB
        if: matrix.platform != 'quest'
        shell: pwsh
        run: ./Tools/Test-NoAdb.ps1 -Path build

      - name: Package build
        if: matrix.platform != 'quest'
        id: package
        run: |
          set -euo pipefail
          folder=$(find build -mindepth 1 -maxdepth 1 -type d | head -1)
          name=$(basename "$folder")
          archive="${name}.zip"
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --sequesterRsrc --keepParent "$folder" "$archive" ;;
            Linux)   ( cd build && zip -r -y -q "../$archive" "$name" ) ;;
            Windows) ( cd build && 7z a -tzip -bso0 "../$archive" "$name" ) ;;
          esac
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          ls -lh "$archive"

      - name: Validate archive contains no ADB
        if: matrix.platform != 'quest'
        shell: pwsh
        run: ./Tools/Test-NoAdb.ps1 -Path '${{ steps.package.outputs.archive }}'

      - name: Upload build artifact
        if: matrix.platform != 'quest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Build Quest
        if: matrix.platform == 'quest'
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle/quest
          HIBOP_QUEST_KEYSTORE_BASE64: ${{ secrets.HIBOP_QUEST_KEYSTORE_BASE64 }}
          HIBOP_QUEST_KEYSTORE_PASSWORD: ${{ secrets.HIBOP_QUEST_KEYSTORE_PASSWORD }}
          HIBOP_QUEST_KEY_ALIAS_PASSWORD: ${{ secrets.HIBOP_QUEST_KEY_ALIAS_PASSWORD }}
        run: |
          set -euo pipefail
          : "${HIBOP_QUEST_KEYSTORE_BASE64:?Missing GitHub Actions secret HIBOP_QUEST_KEYSTORE_BASE64}"
          : "${HIBOP_QUEST_KEYSTORE_PASSWORD:?Missing GitHub Actions secret HIBOP_QUEST_KEYSTORE_PASSWORD}"
          : "${HIBOP_QUEST_KEY_ALIAS_PASSWORD:?Missing GitHub Actions secret HIBOP_QUEST_KEY_ALIAS_PASSWORD}"
          signing_dir="$(mktemp -d "$(cygpath -u "$RUNNER_TEMP")/hibop-quest-signing.XXXXXX")"
          trap 'rm -f -- "$signing_dir/quest.keystore" "$signing_dir/unity.log" "$signing_dir/unity-console.log"; rmdir -- "$signing_dir"' EXIT
          printf '%s' "$HIBOP_QUEST_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/quest.keystore"
          unset HIBOP_QUEST_KEYSTORE_BASE64
          export HIBOP_QUEST_KEYSTORE_PATH="$(cygpath -w "$signing_dir/quest.keystore")"
          "$UNITY_EDITOR_PATH" \
            -batchmode -quit -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -activeBuildProfile Assets/Settings/BuildProfiles/Quest.asset \
            -executeMethod HBP.Dev.HBPBuilder.BuildFromCommandLine \
            -questCiSigning \
            -buildOutput "$GITHUB_WORKSPACE/build" \
            -buildCommit "$GITHUB_SHA" \
            -logFile "$(cygpath -w "$signing_dir/unity.log")" > "$signing_dir/unity-console.log" 2>&1 || {
              build_status=$?
              grep -ohsE 'error CS[0-9]{4}|BuildFailedException|GradleInvokationException' \
                "$signing_dir/unity.log" "$signing_dir/unity-console.log" | sort -u || true
              echo "::error::Unity Quest build failed with exit code $build_status."
              exit "$build_status"
            }
      - name: Package and validate Quest APK
        if: matrix.platform == 'quest'
        id: quest_package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw -LiteralPath codemeta.json | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Missing version in codemeta.json.' }
          $apk = "build/HiBoP.$version.quest.apk"
          Move-Item -LiteralPath build/HiBoP.Quest.apk -Destination $apk
          $build = Get-Content -Raw -LiteralPath build/Quest.build-report.json | ConvertFrom-Json
          $expectedCode = [int]$build.androidVersionCode
          if ($build.result -ne 'Succeeded' -or $build.target -ne 'Android' -or $expectedCode -le 0) {
            throw 'Missing Android version code in the successful Quest build report.'
          }
          $editor = Split-Path -Parent $env:UNITY_EDITOR_PATH
          $aapt = Get-ChildItem -Path (Join-Path $editor 'Data/PlaybackEngines/AndroidPlayer/SDK/build-tools/*/aapt.exe') -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$aapt) { throw 'Unity Android SDK aapt.exe was not found.' }
          $manifest = & $aapt.FullName dump badging $apk
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the packaged Android manifest.' }
          $package = ($manifest | Select-String '^package:' | Select-Object -First 1).Line
          if ($package -notmatch "versionCode='(?<code>[0-9]+)'\s+versionName='(?<version>[^']+)'") {
            throw 'Missing version fields in the packaged Android manifest.'
          }
          if ([int]$Matches.code -ne $expectedCode -or $Matches.version -cne $version) {
            throw "Quest APK contains version $($Matches.version) and versionCode $($Matches.code); expected $version and $expectedCode."
          }
          Write-Host "Verified Quest APK version $version and versionCode $expectedCode."
          ./Tools/Test-QuestApk.ps1 -Apk $apk -ReportPath build/quest-apk-content.json
          "apk=$apk" >> $env:GITHUB_OUTPUT

      - name: Upload Quest build and reports
        if: matrix.platform == 'quest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ steps.quest_package.outputs.apk }}
            build/Quest.build-report.json
            build/quest-apk-content.json
          if-no-files-found: error

  attach_release:
    name: Attach four builds to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: HiBoP-*
          path: release-assets
          merge-multiple: true
      - name: Attach release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk=(release-assets/HiBoP.*.quest.apk)
          if [[ ${#apk[@]} -ne 1 ]]; then
            echo 'Expected exactly one versioned Quest APK.' >&2
            exit 1
          fi
          version="${apk[0]#release-assets/HiBoP.}"
          version="${version%.quest.apk}"
          files=("release-assets/HiBoP.$version.win64.zip" "release-assets/HiBoP.$version.linux64.zip"
            "release-assets/HiBoP.$version.macos64.zip" "${apk[0]}")
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing release file: $file" >&2
              exit 1
            fi
          done
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" "${files[@]}"
